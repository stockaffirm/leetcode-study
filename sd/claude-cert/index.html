<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Claude Certification Tracker · CodeAffirm</title><link rel="stylesheet" href="../../assets/style.css">
<style>
.sdw{max-width:920px;margin:0 auto;padding:18px 16px 60px}.sdw h1{margin:0 0 4px}.sdw .lead{color:var(--mute);margin:0 0 16px}
.card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px 18px;margin:12px 0}.card h2,.card h3{margin:0 0 8px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.sm{padding:6px 12px;font-size:13px}.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.top a{color:var(--accent);text-decoration:none}.who{font-size:13px;color:var(--mute)}
.msg{padding:10px 12px;border-radius:10px;background:var(--accent-soft)}.err{background:#fde8e6;color:#8a1c12}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok);width:0}
.flt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.flt small{color:var(--mute)}
.sec{border:1px solid var(--line);background:var(--card);border-radius:14px;margin:12px 0;overflow:hidden}
.sec>summary{cursor:pointer;padding:14px 16px;font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
.sec>summary::-webkit-details-marker{display:none}.sec .cnt{font-weight:600;font-size:13px;color:var(--mute);white-space:nowrap}
.it{padding:10px 16px;border-top:1px solid var(--line)}.it h3{margin:0 0 6px;font-size:15px}.tag{display:inline-block;padding:0 7px;margin-left:6px;border-radius:99px;background:var(--line);font-size:11px;font-weight:700;vertical-align:middle}
.st{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:center;padding:4px 0;font-size:14px}.st a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}.st span.m{color:var(--mute)}
.ckb{width:30px;height:30px;border-radius:8px;border:2px solid var(--mute);background:transparent;cursor:pointer;color:#fff;font-size:16px;line-height:1;justify-self:center}.ckb[aria-checked=true]{background:var(--ok);border-color:var(--ok)}
.ckb[aria-checked=mixed]{background:var(--accent);border-color:var(--accent)}.ob{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:start}.lk summary{cursor:pointer;color:var(--mute);font-size:13px;margin-top:2px}.lk div{padding:2px 0;font-size:13px}.lk a{color:var(--accent);text-decoration:none}
.mq{margin:4px 0;padding:8px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:6px;font-size:14px}
.it.done h3{color:var(--mute);text-decoration:line-through}.note{font-size:12px;color:var(--mute);margin-top:18px}
</style></head>
<body><div class="sdw" id="app"><p class="lead">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  const SB_URL = "https://mxdljkwconnaanpgvigz.supabase.co", SB_KEY = "sb_publishable_o6BVx6t3iKn1VP4hkrVWQQ_xjofy47K";
  const PROVIDERS = ["github"]; /* add "google" once the Google OAuth key is set up in Supabase */
  const EXAMS = { P: "Architect Professional", A: "Architect Foundations", D: "Developer Foundations" };
  const STEPS = [["v", "Watch"], ["r", "Read"], ["m", "Master"]];
  const $ = s => document.querySelector(s), app = $("#app");
  const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const safeUrl = u => /^https:\/\//.test(u) ? u : "#";
  const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  let S = { user: null, access: null, meta: null, dm: null, plan: null, secs: [], done: {}, exam: "ALL", err: "" };
  const open = new Set(), openB = new Set(); let booted = false;

  const home = () => location.origin + location.pathname;
  const signIn = provider => sb.auth.signInWithOAuth({ provider, options: { redirectTo: home() } });
  const signOut = async () => { await sb.auth.signOut(); S = { user: null, access: null, meta: null, secs: [], done: {}, exam: S.exam, err: "" }; render(); };
  const allowed = () => S.access === "approved";

  async function load(){
    const { data: { session } } = await sb.auth.getSession();
    S.user = session ? session.user : null; S.err = "";
    if(!S.user) return render();
    const a = await sb.from("sd_access").select("status").eq("user_id", S.user.id).maybeSingle();
    S.access = a.data ? a.data.status : null;
    const ad = await sb.rpc("sd_is_admin"); if(ad.data === true) S.access = "approved";
    if(allowed()){
      const c = await sb.from("cert_sections").select("ord,title,items").order("ord");
      if(c.error) S.err = c.error.message; else { S.meta = (c.data.find(r => r.ord === 0) || {}).items; S.dm = (c.data.find(r => r.ord === 100) || {}).items || null; S.plan = (c.data.find(r => r.ord === 101) || {}).items || null; S.bp = (c.data.find(r => r.ord === 102) || {}).items || null; S.det = (c.data.find(r => r.ord === 103) || {}).items || {}; S.dr = (c.data.find(r => r.ord === 104) || {}).items || {}; S.alt = (c.data.find(r => r.ord === 105) || {}).items || null; S.aws = (c.data.find(r => r.ord === 106) || {}).items || null; S.dd = (c.data.find(r => r.ord === 107) || {}).items || null; S.secs = c.data.filter(r => r.ord > 0 && r.ord < 100); }
      const p = await sb.from("cert_progress").select("key"); S.done = {}; (p.data || []).forEach(r => S.done[r.key] = 1);
      if(!booted && /^#t-\d+-\d+$/.test(location.hash)){ const m = location.hash.match(/^#t-(\d+)-(\d+)$/); setTimeout(() => jump(m[1] + "." + m[2]), 0); }
      if(!booted){ booted = true; const f = S.secs.find(s => s.items.some((_, i) => !S.done[s.ord + "." + i + ".m"])); if(f) open.add(f.ord); }
    }
    render();
  }
  async function requestAccess(){ const r = await sb.from("sd_access").insert({ user_id: S.user.id }); if(r.error) S.err = r.error.message; await load(); }
  async function toggle(key){
    const on = !S.done[key];
    if(on) S.done[key] = 1; else delete S.done[key]; render();
    const r = on ? await sb.from("cert_progress").upsert({ user_id: S.user.id, key }) : await sb.from("cert_progress").delete().eq("user_id", S.user.id).eq("key", key);
    if(r.error){ if(on) delete S.done[key]; else S.done[key] = 1; S.err = "Could not save: " + r.error.message; render(); }
  }

  const vis = it => S.exam === "ALL" || it.g.includes(S.exam);
  const stepsOf = it => it.v ? STEPS : STEPS.filter(([k]) => k !== "v");
  const itemDone = (s, i) => stepsOf(s.items[i]).every(([k]) => S.done[s.ord + "." + i + "." + k]);
  const stepCount = (s, i) => stepsOf(s.items[i]).filter(([k]) => S.done[s.ord + "." + i + "." + k]).length;
  function totals(){ let t = 0, d = 0, ti = 0, di = 0; S.secs.forEach(s => s.items.forEach((it, i) => { if(!vis(it)) return; ti++; const n = stepsOf(it).length; t += n; const c = stepCount(s, i); d += c; if(c === n) di++; })); return { t, d, ti, di }; }
  const ordered = () => (S.plan && S.plan.order[S.exam]) ? S.plan.order[S.exam].map(o => S.secs.find(s => s.ord === o)).filter(Boolean) : S.secs;
  const blueprint = () => { const e = S.exam !== "ALL" && S.plan && S.plan.exams[S.exam]; if(!e) return "";
    return `<div class="card"><h3>${esc(e.name)}</h3><p style="margin:4px 0">${e.items} items · 120 minutes · $${e.fee} · pass 720/1000 · credential valid 12 months${e.note ? " · " + esc(e.note) : ""}</p><ul style="margin:6px 0;padding-left:20px">${e.domains.map(([n, w]) => `<li>${esc(n)} <b>${w}%</b></li>`).join("")}</ul><small>Study the sections in the order shown, basics first, building up. The weights above show where to spend the most time. Source: official exam guide v1.0 (July 2026).</small></div>`; };

  const topicOf = k => { const [o, i] = k.split("."); const s = S.secs.find(x => x.ord === +o); return s && s.items[+i] ? { s, i: +i, it: s.items[+i] } : null; };
  const topicKeys = t => stepsOf(t.it).map(([k]) => t.s.ord + "." + t.i + "." + k);
  const objInfo = o => { const ts = o.l.map(topicOf).filter(Boolean); return { ts, done: ts.filter(t => itemDone(t.s, t.i)).length, total: ts.length }; };
  const objDone = x => x.total > 0 && x.done === x.total;
  async function toggleObj(di, oi){
    const o = S.bp[S.exam][di].o[oi], x = objInfo(o), keys = x.ts.flatMap(topicKeys), on = !objDone(x);
    if(!on && !confirm("Clear these topics? Topics shared with other objectives will show as incomplete there too.")) return;
    const prev = Object.assign({}, S.done);
    keys.forEach(k => { if(on) S.done[k] = 1; else delete S.done[k]; }); render();
    const r = on ? await sb.from("cert_progress").upsert(keys.map(key => ({ user_id: S.user.id, key }))) : await sb.from("cert_progress").delete().eq("user_id", S.user.id).in("key", keys);
    if(r.error){ S.done = prev; S.err = "Could not save: " + r.error.message; render(); }
  }
  function jump(key){ const t = topicOf(key); if(!t) return; S.view = "topics"; if(!vis(t.it)) S.exam = "ALL"; open.add(t.s.ord); render(); const el = document.getElementById("t-" + t.s.ord + "-" + t.i); if(el) el.scrollIntoView({ block: "center" }); }
  const SCN = ["scn-support-resolution-agent", "scn-claude-code-team-workflow", "scn-multi-agent-research", "scn-developer-productivity-agent", "scn-claude-code-ci", "scn-structured-data-extraction"];
  const scnLink = slug => `<p style="margin:4px 0;font-size:13px"><a href="../#${slug}">Open the full system design →</a></p>`;
  function detHtml(key){ const sm = key.match(/^A\.5\.(\d)$/); if(sm && SCN[+sm[1]]) return scnLink(SCN[+sm[1]]) + (S.det && S.det[key] ? detHtml2(key) : "");
    return detHtml2(key); }
  function detHtml2(key){ const d = S.det && S.det[key]; if(!d) return "";
    const ul = a => `<ul style="margin:4px 0;padding-left:20px">${a.map(b => `<li>${esc(b)}</li>`).join("")}</ul>`;
    return `<details class="lk"><summary>From the exam guide</summary>${d.d ? `<p style="margin:4px 0;font-size:13px">${esc(d.d)}</p>` : `${d.k && d.k.length ? `<small><b>Knowledge of</b></small>${ul(d.k)}` : ""}${d.s && d.s.length ? `<small><b>Skills in</b></small>${ul(d.s)}` : ""}`}</details>`; }
  function bpHtml(){
    const B = S.bp && S.bp[S.exam]; if(!B) return `<div class="card"><p class="msg">Pick an exam above to see its blueprint.</p></div>`;
    const e = S.plan && S.plan.exams[S.exam]; let T = 0, Dn = 0; B.forEach(dom => dom.o.forEach(o => { T++; if(objDone(objInfo(o))) Dn++; }));
    return `<div class="card"><h3>${esc(e ? e.name : "")} blueprint</h3>${e ? `<p style="margin:4px 0">${e.items} items · 120 minutes · $${e.fee} · pass 720/1000 · valid 12 months${e.note ? " · " + esc(e.note) : ""}</p>` : ""}<p style="margin:6px 0"><a href="../#${({ P: "sample-q-professional", A: "sample-q-architect-foundations", D: "sample-q-developer" })[S.exam]}">Practice: the guide's official sample questions →</a></p><div class="bar"><i style="width:${T ? Math.round(100 * Dn / T) : 0}%"></i></div><small>${Dn} of ${T} objectives complete. Ticking an objective ticks every linked topic, and ticking topics fills the objective, so both views share one set of ticks. Source: official exam guide v1.0 (July 2026), objectives condensed.</small></div>` +
      B.map((dom, di) => { const id = S.exam + di; let d = 0; dom.o.forEach(o => { if(objDone(objInfo(o))) d++; });
        return `<details class="sec" data-bd="${id}"${openB.has(id) ? " open" : ""}><summary><span>${esc(dom.n)}${dom.w != null ? ` <span class="tag">${dom.w}%</span>` : ""}</span><span class="cnt">${d}/${dom.o.length}</span></summary>` +
          dom.o.map((o, oi) => { const x = objInfo(o), st = objDone(x) ? "true" : x.done ? "mixed" : "false";
            return `<div class="it"><div class="ob"><button class="ckb" role="checkbox" aria-checked="${st}" aria-label="${esc(o.t)}" data-ob="${di}.${oi}">${st === "true" ? "✓" : st === "mixed" ? "–" : ""}</button><div><div>${esc(o.t)}</div>${detHtml(S.exam + "." + di + "." + oi)}<details class="lk"><summary>${x.done}/${x.total} topics</summary>${x.ts.map(t => `<div><a href="#" data-j="${t.s.ord}.${t.i}">${itemDone(t.s, t.i) ? "✓ " : ""}${esc(t.it.t)}</a></div>`).join("")}</details></div></div></div>`; }).join("") + `</details>`; }).join("");
  }

  const head = () => `<div class="top"><a href="../">← System Design Prep</a><span class="who">${S.user ? esc(S.user.email || "") + ' · <a href="#" id="so">Sign out</a>' : ""}</span></div><h1>Claude Certification Tracker</h1>`;
  function gate(){
    if(!S.user) return `<p class="lead">Private study tracker. Access is by approval.</p><div class="card"><h2>Sign in</h2><p>Sign in with the same account you use for System Design Prep.</p><div class="btns">${PROVIDERS.map((p, i) => `<button class="btn${i ? "" : " pri"}" data-p="${p}">Continue with ${p === "google" ? "Google" : "GitHub"}</button>`).join("")}</div></div>`;
    if(S.access === "denied") return `<div class="card"><h2>Access not granted</h2><p>This request was not approved.</p></div>`;
    if(S.access === "pending") return `<div class="card"><h2>Waiting for approval</h2><p class="msg">Your request is in. Check back later.</p></div>`;
    return `<div class="card"><h2>Request access</h2><p>Signed in as <b>${esc(S.user.email)}</b>.</p><div class="btns"><button class="btn pri" id="req">Request access</button></div></div>`;
  }
  function awsHtml(key){ const t = S.aws && S.aws[key]; return t ? `<div class="m" style="font-size:13px"><b>AWS Bedrock:</b> ${esc(t)}</div>` : ""; }
  function altHtml(key){ const a = S.alt, c = S.meta.courses[3]; const ids = a && a.m[key]; if(!ids || !c) return "";
    return `<div class="m" style="font-size:13px">Also (alt course): ` + ids.map(n => `<a href="${esc(safeUrl(c.u.replace(/\/?$/, "/") + "learn/lecture/" + a.i[n]))}" target="_blank" rel="noopener noreferrer">${esc(a.t[n])}</a>`).join(" · ") + `</div>`; }
  function stepHtml(s, i, it, k, lab){
    const key = s.ord + "." + i + "." + k, on = !!S.done[key]; let body;
    if(k === "v"){ const c = S.meta.courses[it.v[0]], lid = S.meta.lec && S.meta.lec[it.v[0]] && S.meta.lec[it.v[0]][it.v[1]];
      const href = lid ? c.u.replace(/\/?$/, "/") + "learn/lecture/" + lid : c.u;
      body = `<b>Watch:</b> <a href="${esc(safeUrl(href))}" target="_blank" rel="noopener noreferrer">${esc(c.n)} — ${esc(it.v[1])}</a>${lid ? "" : ` <span class="m">(course start; find the lecture in the outline)</span>`}${altHtml(s.ord + "." + i)}`; }
    else if(k === "r"){ const ids = S.dm && S.dm.map[s.ord + "." + i]; const ds = (ids ? ids.map(n => S.dm.docs[n]) : [S.meta.docs[it.r]]).filter(Boolean);
      const weak = S.plan && S.plan.weak && S.plan.weak.includes(s.ord + "." + i);
      body = `<b>Read:</b> ` + (ds.length ? ds.map(d => `<a href="${esc(safeUrl(d.u))}" target="_blank" rel="noopener noreferrer">${esc(d.n)}</a>`).join(" · ") : `<span class="m">${esc(it.n || "No matching docs page.")}</span>`) + (weak && ds.length ? ` <span class="m">(closest pages; no dedicated docs)</span>` : "") + awsHtml(s.ord + "." + i); }
    else { const dq = S.dr && S.dr[s.ord] && S.dr[s.ord][i];
      body = dq ? `<b>Master:</b> answer this out loud or on paper first, with no notes.<div class="mq">${esc(dq[0])}</div><details class="lk"><summary>Show model answer</summary><p style="margin:4px 0;font-size:13px">${esc(dq[1])}</p></details>` : `<b>Master:</b> <span class="m">explain / implement without notes</span>`; }
    return `<div class="st"><button class="ckb" role="checkbox" aria-label="${lab}" aria-checked="${on}" data-k="${esc(key)}">${on ? "✓" : ""}</button><div>${body}</div></div>`;
  }
  function render(){
    if(!S.user || !allowed()){ app.innerHTML = head() + (S.err ? `<p class="msg err">${esc(S.err)}</p>` : "") + gate(); return wire(); }
    if(!S.meta){ app.innerHTML = head() + (S.err ? `<p class="msg err">${esc(S.err)}</p>` : `<p class="lead">Loading…</p>`); return wire(); }
    const T = totals(), pct = T.t ? Math.round(100 * T.d / T.t) : 0;
    const OS = ordered(); let next = null; for(const s of OS){ const i = s.items.findIndex((it, j) => vis(it) && !itemDone(s, j)); if(i >= 0){ next = { s, i }; break; } }
    app.innerHTML = head() + (S.err ? `<p class="msg err">${esc(S.err)}</p>` : "") +
      `<p class="lead">Watch the lesson, read the source, then explain or implement it from memory. Tick each step.${S.meta.udemyHome ? ` <a href="${esc(safeUrl(S.meta.udemyHome))}" target="_blank" rel="noopener noreferrer">Open Udemy</a>` : ""}</p>
      <div class="card"><h2>${pct}% complete</h2><div class="bar"><i style="width:${pct}%"></i></div><small>${T.di} of ${T.ti} topics fully mastered · ${T.d} of ${T.t} steps</small>
      <div class="flt"><small>Exam:</small>${[["ALL", "All"], ["P", "Professional"], ["A", "Arch. Foundations"], ["D", "Dev. Foundations"]].map(([k, l]) => `<button class="btn sm${S.exam === k ? " on" : ""}" data-e="${k}">${l}</button>`).join("")}</div>
      <div class="flt"><small>View:</small>${[["topics", "Topics"], ["bp", "Exam blueprint"]].map(([k, l]) => `<button class="btn sm${(S.view || "topics") === k ? " on" : ""}" data-v="${k}">${l}</button>`).join("")}</div>
      ${next ? `<div class="btns"><button class="btn sm pri" id="nx">Jump to next unfinished topic</button></div>` : `<p class="msg">Everything in this view is done.</p>`}</div>` + (S.view === "bp" ? bpHtml() : blueprint() +
      OS.map(s => { const idx = s.items.map((it, i) => i).filter(i => vis(s.items[i])); if(!idx.length) return "";
        const dn = idx.filter(i => itemDone(s, i)).length;
        return `<details class="sec" data-o="${s.ord}"${open.has(s.ord) ? " open" : ""}><summary><span>${String(s.ord).padStart(2, "0")}. ${esc(s.title)}</span><span class="cnt">${dn}/${idx.length}</span></summary>` +
          idx.map(i => { const it = s.items[i]; return `<div class="it${itemDone(s, i) ? " done" : ""}" id="t-${s.ord}-${i}"><h3>${esc(it.t)}${[...it.g].map(g => `<span class="tag" title="${EXAMS[g]}">${g}</span>`).join("")}</h3>${s.ord === 17 && i >= 12 && i <= 17 ? scnLink(SCN[i - 12]) : ""}${S.dd && S.dd[s.ord + "." + i] ? `<p style="margin:4px 0;font-size:13px"><a href="../#${esc(S.dd[s.ord + "." + i])}">Deep dive: full visual explainer →</a></p>` : ""}${stepsOf(it).map(([k, l]) => stepHtml(s, i, it, k, l)).join("")}</div>`; }).join("") + `</details>`; }).join("")) +
      `<p class="note">P = Architect Professional, A = Architect Foundations, D = Developer Foundations. Exam tags are editorial study mappings, not official task identifiers. Udemy links open the course; find the exact lecture inside it, and some lectures are only the closest relevant lesson. Topics without a Watch step came from the exam guides and have no matching lecture. Verify syntax against current official documentation and your exam guide.</p>`;
    wire(); const nx = $("#nx"); if(nx && next) nx.onclick = () => { open.add(next.s.ord); render(); const el = document.getElementById("t-" + next.s.ord + "-" + next.i); if(el) el.scrollIntoView({ block: "center" }); };
  }
  function wire(){
    const so = $("#so"); if(so) so.onclick = e => { e.preventDefault(); signOut(); };
    app.querySelectorAll("[data-p]").forEach(b => b.onclick = () => signIn(b.dataset.p));
    const rq = $("#req"); if(rq) rq.onclick = requestAccess;
    app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => toggle(b.dataset.k));
    app.querySelectorAll("[data-e]").forEach(b => b.onclick = () => { S.exam = b.dataset.e; render(); });
    app.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { S.view = b.dataset.v; if(S.view === "bp" && S.exam === "ALL") S.exam = "P"; render(); });
    app.querySelectorAll("[data-ob]").forEach(b => b.onclick = () => { const [di, oi] = b.dataset.ob.split(".").map(Number); toggleObj(di, oi); });
    app.querySelectorAll("[data-j]").forEach(a => a.onclick = e => { e.preventDefault(); jump(a.dataset.j); });
    app.querySelectorAll("details[data-bd]").forEach(d => d.addEventListener("toggle", () => { if(d.open) openB.add(d.dataset.bd); else openB.delete(d.dataset.bd); }));
    app.querySelectorAll("details[data-o]").forEach(d => d.addEventListener("toggle", () => { const o = +d.dataset.o; if(d.open) open.add(o); else open.delete(o); }));
  }
  sb.auth.onAuthStateChange(ev => { if(ev === "SIGNED_IN" || ev === "SIGNED_OUT" || ev === "INITIAL_SESSION") load(); });
})();
</script></body></html>
