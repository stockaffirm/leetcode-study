<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Private Chat · CodeAffirm</title><link rel="stylesheet" href="../../assets/style.css">
<style>
.sdw{max-width:820px;margin:0 auto;padding:18px 16px 40px}.sdw h1{margin:0 0 4px}.sdw .lead{color:var(--mute);margin:0 0 12px}
.card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px 18px;margin:12px 0}.card h2{margin:0 0 8px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.5;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.top a{color:var(--accent);text-decoration:none}.who{font-size:13px;color:var(--mute)}
.msg{padding:10px 12px;border-radius:10px;background:var(--accent-soft)}.err{background:#fde8e6;color:#8a1c12}
input[type=password],textarea{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,sans-serif}
#log{display:flex;flex-direction:column;gap:10px;margin:12px 0;min-height:120px}
.b{padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;max-width:92%}.b.u{align-self:flex-end;background:var(--accent);color:#fff}.b.a{align-self:flex-start;border:1px solid var(--line);background:var(--card)}
.row{display:flex;gap:10px;align-items:flex-end}.row textarea{flex:1;min-height:48px;max-height:160px;resize:vertical}
</style></head>
<body><div class="sdw" id="app"><p class="lead">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  const SB_URL = "https://mxdljkwconnaanpgvigz.supabase.co", SB_KEY = "sb_publishable_o6BVx6t3iKn1VP4hkrVWQQ_xjofy47K";
  const $ = s => document.querySelector(s), app = $("#app");
  const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  let user = null, isAdmin = false, passcode = "", msgs = [], busy = false, err = "";

  const home = () => location.origin + location.pathname;
  const head = () => `<div class="top"><a href="../">← System Design Prep</a><span class="who">${user ? esc(user.email || "") + ' · <a href="#" id="so">Sign out</a>' : ""}</span></div><h1>Private Chat</h1>`;

  async function load(){
    const { data: { session } } = await sb.auth.getSession(); user = session ? session.user : null; isAdmin = false;
    if(user){ const r = await sb.rpc("sd_is_admin"); isAdmin = r.data === true; }
    render();
  }
  function render(){
    if(!user){ app.innerHTML = head() + `<p class="lead">Owner only.</p><div class="card"><h2>Sign in</h2><div class="btns"><button class="btn pri" id="gh">Continue with GitHub</button></div></div>`; $("#gh").onclick = () => sb.auth.signInWithOAuth({ provider: "github", options: { redirectTo: home() } }); return wire(); }
    if(!isAdmin){ app.innerHTML = head() + `<div class="card"><h2>Not authorized</h2><p>This chat is private.</p></div>`; return wire(); }
    if(!passcode){ app.innerHTML = head() + (err ? `<p class="msg err">${esc(err)}</p>` : "") + `<div class="card"><h2>Chat passcode</h2><p>Enter your chat passcode. It is held in memory only and cleared when you close or reload this page.</p><form id="pf"><input type="password" id="pc" autocomplete="off" placeholder="Passcode"><div class="btns"><button class="btn pri" type="submit">Unlock</button></div></form></div>`;
      $("#pf").onsubmit = e => { e.preventDefault(); passcode = $("#pc").value; err = ""; render(); }; return wire(); }
    app.innerHTML = head() + (err ? `<p class="msg err">${esc(err)}</p>` : "") + `<p class="lead">Powered by Claude through your own API key. Conversations are not stored.</p><div id="log"></div><div class="row"><textarea id="in" placeholder="Ask anything…" rows="2"></textarea><button class="btn pri" id="go">Send</button></div><div class="btns"><button class="btn" id="clr">New chat</button><button class="btn" id="lock">Lock</button></div>`;
    drawLog(); $("#go").onclick = send; $("#in").onkeydown = e => { if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); send(); } };
    $("#clr").onclick = () => { msgs = []; err = ""; render(); }; $("#lock").onclick = () => { passcode = ""; msgs = []; render(); }; wire();
  }
  function drawLog(){ const log = $("#log"); if(!log) return; log.textContent = ""; msgs.forEach(m => { const d = document.createElement("div"); d.className = "b " + (m.role === "user" ? "u" : "a"); d.textContent = m.content; log.appendChild(d); }); }
  async function send(){
    const inp = $("#in"), text = inp.value.trim(); if(!text || busy) return;
    busy = true; $("#go").disabled = true; err = ""; msgs.push({ role: "user", content: text }); const a = { role: "assistant", content: "" }; inp.value = ""; drawLog();
    try{
      const { data: { session } } = await sb.auth.getSession(); if(!session) throw new Error("Session expired. Reload and sign in.");
      const r = await fetch(SB_URL + "/functions/v1/chat", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token, apikey: SB_KEY }, body: JSON.stringify({ passcode, messages: msgs.slice() }) });
      if(!r.ok){ let m = "Error " + r.status; try{ m = (await r.json()).error || m; }catch(_){} if(r.status === 401 && /passcode/i.test(m)) passcode = ""; throw new Error(m); }
      msgs.push(a); const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
      for(;;){ const { done, value } = await rd.read(); if(done) break; buf += dec.decode(value, { stream: true }); let i;
        while((i = buf.indexOf("\n")) >= 0){ const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if(!line.startsWith("data:")) continue;
          try{ const ev = JSON.parse(line.slice(5)); if(ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta"){ a.content += ev.delta.text; drawLog(); } }catch(_){} } }
    }catch(e){ err = e.message; if(msgs.length && msgs[msgs.length - 1] === a && !a.content) msgs.pop(); if(msgs.length && msgs[msgs.length - 1].role === "user") msgs.pop(); }
    busy = false; render();
  }
  function wire(){ const so = $("#so"); if(so) so.onclick = async e => { e.preventDefault(); await sb.auth.signOut(); passcode = ""; msgs = []; user = null; render(); }; }
  sb.auth.onAuthStateChange(ev => { if(ev === "SIGNED_IN" || ev === "SIGNED_OUT" || ev === "INITIAL_SESSION") load(); });
})();
</script></body></html>
